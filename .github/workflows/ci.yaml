name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: helm lint
        run: helm lint chart

      - name: helm template (default values)
        run: helm template easre chart --namespace easre-test > /tmp/rendered.yaml

      - name: Validate rendered manifests
        uses: instrumenta/kubeval-action@master
        with:
          files: /tmp/rendered.yaml
          # Skip OpenShift-specific kinds (Route) that the upstream kubeval schemas don't ship.
          flags: '--ignore-missing-schemas'

  python:
    name: python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check payment-service payment-loadgen remediation-agent
