{{- if .Values.remediationAgent.enabled }}
{{- $ns := include "easre.namespace" . -}}
{{- $allowedNs := default $ns .Values.remediationAgent.config.allowedNamespaces -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-agent
  namespace: {{ $ns }}
  labels:
    {{- include "easre.labels" (dict "name" "remediation-agent" "root" .) | nindent 4 }}
{{- if .Values.remediationAgent.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-agent
  namespace: {{ $ns }}
  labels:
    {{- include "easre.labels" (dict "name" "remediation-agent" "root" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-agent
  namespace: {{ $ns }}
  labels:
    {{- include "easre.labels" (dict "name" "remediation-agent" "root" .) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: remediation-agent
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: remediation-agent
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remediation-agent-config
  namespace: {{ $ns }}
  labels:
    {{- include "easre.labels" (dict "name" "remediation-agent" "root" .) | nindent 4 }}
data:
  AGENT_NAME: {{ .Values.remediationAgent.config.agentName | quote }}
  AGENT_HOST: "0.0.0.0"
  AGENT_PORT: "8080"
  AGENT_EXTERNAL_URL: "http://remediation-agent.{{ $ns }}.svc.cluster.local:8080"
  ALLOWED_NAMESPACES: {{ $allowedNs | quote }}
  DRY_RUN: {{ .Values.remediationAgent.config.dryRun | quote }}
  LOG_LEVEL: {{ .Values.remediationAgent.config.logLevel | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-agent
  namespace: {{ $ns }}
  labels:
    {{- include "easre.labels" (dict "name" "remediation-agent" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.remediationAgent.replicas }}
  selector:
    matchLabels:
      app: remediation-agent
  template:
    metadata:
      labels:
        {{- include "easre.labels" (dict "name" "remediation-agent" "root" .) | nindent 8 }}
    spec:
      serviceAccountName: remediation-agent
      containers:
        - name: remediation-agent
          image: {{ include "easre.image" (dict "image" .Values.remediationAgent.image "ns" $ns "name" "remediation-agent") }}
          imagePullPolicy: {{ .Values.remediationAgent.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: remediation-agent-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.remediationAgent.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-agent
  namespace: {{ $ns }}
  labels:
    {{- include "easre.labels" (dict "name" "remediation-agent" "root" .) | nindent 4 }}
spec:
  selector:
    app: remediation-agent
  ports:
    - port: {{ .Values.remediationAgent.service.port }}
      targetPort: 8080
  type: ClusterIP
{{- if .Values.remediationAgent.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: remediation-agent
  namespace: {{ $ns }}
  labels:
    {{- include "easre.labels" (dict "name" "remediation-agent" "root" .) | nindent 4 }}
spec:
  to:
    kind: Service
    name: remediation-agent
  port:
    targetPort: 8080
  tls:
    termination: {{ .Values.remediationAgent.route.tls.termination }}
{{- end }}
{{- end }}
